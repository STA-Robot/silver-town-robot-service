# ── 네트워크 설정 ──────────────────────────────────────────────
# 실제 환경에 맞게 수정 후 사용

server:
  ip: "0.0.0.0"          # AI 서버 수신 IP (0.0.0.0 = 모든 인터페이스)
  video_port: 9999        # 영상 수신 포트 (로봇 4대 공통)
  control_port: 9990      # 로봇 → AI서버 제어 신호 포트 (ACTIVE 등)
  command_port: 9998      # AI서버 → 로봇 명령 포트

robots:
  - id: "robot_1"
    ip: "192.168.1.10"    # 실제 로봇 IP로 교체
    domain_id: 0

  - id: "robot_2"
    ip: "192.168.1.11"
    domain_id: 1

  - id: "robot_3"
    ip: "192.168.1.12"
    domain_id: 2

  - id: "robot_4"
    ip: "192.168.1.13"
    domain_id: 3