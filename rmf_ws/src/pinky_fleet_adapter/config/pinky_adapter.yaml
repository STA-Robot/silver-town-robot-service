# Pinky RMF adapter runtime config.
# RMF domain topic names are defined under fleet_manager.robots.
rmf_fleet:
  name: pinky
  limits:
    linear: [0.2, 0.5]
    angular: [1.0, 2.0]
  profile:
    footprint: 0.12
    vicinity: 0.35
  reversible: false
  battery_system:
    voltage: 7.4
    capacity: 2.0
    charging_current: 1.0
  mechanical_system:
    mass: 2.0
    moment_of_inertia: 1.0
    friction_coefficient: 0.22
  ambient_system:
    power: 5.0
  tool_system:
    power: 0.0
  recharge_threshold: 0.10
  recharge_soc: 1.0
  publish_fleet_state: 10.0
  account_for_battery_drain: false
  task_capabilities:
    loop: true
    delivery: false
  finishing_request: park
  responsive_wait: true
  task_event_topic: /task_events
  # Nav2/map-frame yaw in radians to use for selected destinations.
  parking_yaws:
    pinky1_parking_spot: -1.5708
    pinky2_parking_spot: -1.5708
    wp1: -1.5708
    warehouse: 3.1416
    table_1: 0.0
    table_2: 1.5708
    table_3: 0.0
  max_merge_waypoint_distance: 0.02
  max_merge_lane_distance: 0.02
  robots:
    pinky1:
      charger: pinky1_parking_spot
    pinky2:
      charger: pinky2_parking_spot
  robot_state_update_frequency: 10.0

fleet_manager:
  # RMF domain에서 보이는 topic 이름이다.
  # 각 Pinky local domain의 /command, /state는 domain bridge remap으로
  # /pinky1/command, /pinky1/state처럼 로봇별 topic으로 연결한다.
  prefix: ""
  user: ""
  password: ""
  robots:
    pinky1:
      rmf_level: L1
      command_topic: /pinky1/command
      state_topic: /pinky1/state
      state_timeout: 2.0
      command_accept_timeout: 2.0
      command_finish_timeout: 300.0
    pinky2:
      rmf_level: L1
      command_topic: /pinky2/command
      state_topic: /pinky2/state
      state_timeout: 2.0
      command_accept_timeout: 2.0
      command_finish_timeout: 300.0

reference_coordinates:
  L1:
    rmf:
      - [0.14843501242721335, -0.2078090173980987] # pinky2_parking_spot
      - [0.2078090173980987, -1.2468541043885921] # wp1
      - [0.34634836233016447, -0.2078090173980987] # pinky1_parking_spot
      - [0.5838443822137058, -0.3958266998059023] # warehouse
      - [0.5739487147185584, -0.9181695085372661] # table_1
      - [0.4947833747573778, -1.810907151612003] # table_3
      - [0.8609230720778375, -1.2468541043885921] # table_2
    robot:
      - [-0.02900, 1.62900] # pinky2_parking_spot
      - [-0.02000, 0.59900] # wp1
      - [0.12100, 1.62900] # pinky1_parking_spot
      - [0.56500, 1.43900] # warehouse
      - [0.36100, 0.93115] # table_1
      - [0.29100, -0.04100] # table_3
      - [0.72496, 0.59475] # table_2
